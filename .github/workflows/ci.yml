name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          check-latest: true
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node scripts/rebrand-engine.mjs check
      - name: CLI branding scan
        if: runner.os == 'Linux'
        run: node scripts/verify-branding.mjs --all-commands
      - name: Gateway + dashboard smoke test
        run: node scripts/smoke.mjs --timeout 600
