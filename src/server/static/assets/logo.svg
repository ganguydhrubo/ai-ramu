<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#E07B18" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1CAE0D" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(15, 10)">
    <!-- Base Rounded Container -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#0F172A" stroke="#334155" stroke-width="2.5" />
    
    <!-- Outer Kinetic Arc - Saffron -->
    <path d="M 50 15 A 35 35 0 0 1 85 50" fill="none" stroke="url(#saffronGrad)" stroke-width="6" stroke-linecap="round" />
    
    <!-- Inner Action Gear / Hub -->
    <circle cx="50" cy="50" r="24" fill="#1E293B" stroke="#475569" stroke-width="2" />
    
    <!-- Lower Kinetic Arc - Deep Green -->
    <path d="M 50 85 A 35 35 0 0 1 15 50" fill="none" stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- Central Neural Spark (Pure White) -->
    <polygon points="50,33 54,46 67,50 54,54 50,67 46,54 33,50 46,46" fill="#FFFFFF" filter="url(#glow)" />
    
    <!-- Indian Saffron & Green Accent Dots -->
    <circle cx="50" cy="15" r="4.5" fill="#FF9933" />
    <circle cx="50" cy="85" r="4.5" fill="#138808" />
  </g>

  <!-- Typography -->
  <g transform="translate(130, 20)">
    <!-- Brand Title -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="1" fill="#FFFFFF">
      AI <tspan fill="url(#saffronGrad)">RAMU</tspan>
    </text>
    
    <!-- Tagline -->
    <text x="2" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#94A3B8" letter-spacing="0.5">
      Bolo Ramu, Kaam Shuru.
    </text>

    <!-- Sub-tagline -->
    <text x="2" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#1CAE0D" letter-spacing="0.2">
      Your Indian AI Worker • Desktop Agent & Automation Platform
    </text>
  </g>
</svg>
